# =============================================================================
# Ra_medium.yaml — ML-Agents PPO config for RobotAgent.cs (trainingMode=Medium)
# -----------------------------------------------------------------------------
# Obs size 19 (Easy 13 + opponent block [13-18]). Action space: 4 discrete.
# A scripted opponent contests the ball; its own-goal/defence reward branch is
# Hard-only, so it does NOT fire here.
#
# CHANGED vs the previous Ra_medium.yaml:
#   • Added the `opponent_skill` environment parameter (new — see below). This
#     drives ScriptedOpponent.SetSkill(), which is ORTHOGONAL to opponent_speed:
#     speed scales raw motion, skill scales hesitation/ball-interception-lead/
#     aim-precision. Previously the opponent only had 3 fixed discrete presets;
#     this lets it be curriculum-ramped smoothly just above the agent's current
#     skill instead of jumping between rungs.
#   • Hyperparameters are UNCHANGED — the egocentric-observation fix changed the
#     relative-vector FORMULA and repurposed obs[2-3] (self-velocity instead of
#     raw heading), not the reward scale, so the previous tuning still applies.
#     Obs size is still 19.
#
# MUST MATCH UNITY (verify before launch — a Space Size mismatch silently
# produces a garbage policy / near-constant action histogram):
#   • Behavior Parameters -> Behavior Name        = RobotAgent
#   • Behavior Parameters -> Vector Obs Space     = 19        (Easy was 13!)
#         UNCHANGED size; slot meanings changed — do not resume an old Medium
#         checkpoint onto this run.
#   • Behavior Parameters -> Discrete Branch 0    = 4
#   • RobotAgent.Training Mode                     = Medium
#   • RobotAgent.Opponent                          = assigned (ScriptedOpponent)
#       — and on that ScriptedOpponent: ball / targetGoal(=AI OwnGoal, renamed
#          from scoringGoal — migrates automatically via FormerlySerializedAs) /
#          arenaRoot assigned, opponentDifficulty=Medium, arenaHalfSize=0.75,
#          controlDistance=0.20.  If Opponent is left empty the curriculum below
#          does nothing and you are training "Easy with 19 obs vs nobody".
#   • Agent (Inspector) -> Max Step                ~ 4000   (per-EPISODE length;
#         NOT the same as max_steps below, which is TOTAL training steps.)
#
# Spawn-curriculum-v2 (off-axis %, wall-ball %, random kickoff, ball mass) lives
# in the RobotAgent INSPECTOR, not here — this file only drives ball_spawn_radius,
# control_distance, opponent_speed, and (new) opponent_skill.
#
# Run:
#   mlagents-learn Ra_medium.yaml --run-id=medium_v2_egocentric --force
#   (fresh run-id, never --resume onto a differently-shaped run)
# =============================================================================

behaviors:
  RobotAgent:
    trainer_type: ppo

    hyperparameters:
      batch_size: 1024
      buffer_size: 20480
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 5.0e-3              # lower than Easy — the opponent already forces variety
      beta_schedule: linear     # anneals exploration by max_steps; don't stop the
                                # run FAR short or the deterministic export is under-committed
      epsilon: 0.2
      epsilon_schedule: linear
      lambd: 0.95
      num_epoch: 3

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    keep_checkpoints: 10
    checkpoint_interval: 500000
    # Easy converged by ~2.5M. Medium must also beat a contesting opponent, so it
    # gets more — but treat this as a CEILING, not a target: watch the reward
    # curve and stop at the plateau. If you shorten this, the curriculum below
    # (fractions of max_steps) compresses with it, which is what you want.
    max_steps: 8000000
    time_horizon: 256           # longer sequences: dribble around opponent -> goal
    summary_freq: 50000
    threaded: true

# -----------------------------------------------------------------------------
# Environment parameters read by RobotAgent.OnEpisodeBegin()
# -----------------------------------------------------------------------------
environment_parameters:

  # Ball start distance from the robot scales with this (via the v2 spawn Lerp).
  # 0.5–1.0 keeps starts at a genuine chase distance; the LEFT/RIGHT and wall
  # variety comes from the Inspector spawn-curriculum, not from here.
  ball_spawn_radius:
    sampler_type: uniform
    sampler_parameters:
      min_value: 0.5
      max_value: 1.0

  # Sim-to-real PINNED value. The C# must read the key "control_distance"
  # (config.CONTROL_DIST_M = 0.20); if the key name differs, this is silently
  # ignored and the Inspector's 0.20 is used — which is why keeping it 0.20 here
  # is a safe redundancy, not a risk.
  control_distance: 0.2

  # Opponent speed ramps on a fixed PROGRESS schedule (fraction of max_steps),
  # NOT on reward — this avoids the threshold-stall that broke the Easy attempt.
  # Value is handed to ScriptedOpponent.SetSpeedMultiplier() via curOpponentSpeed
  # (and multiplies the opponent's built-in SPEED_MULT[Medium]=1.0).
  # At max_steps=8M: slow→moderate at 2.64M, moderate→full at 5.28M.
  opponent_speed:
    curriculum:
      - name: slow
        completion_criteria:
          measure: progress
          behavior: RobotAgent
          min_lesson_length: 100
          threshold: 0.33
        value: 0.5
      - name: moderate
        completion_criteria:
          measure: progress
          behavior: RobotAgent
          min_lesson_length: 100
          threshold: 0.66
        value: 0.75
      - name: full
        value: 1.0

  # NEW: opponent SKILL (hesitation / ball-interception lead / aim precision),
  # orthogonal to speed above. Ramped on the same progress schedule so the
  # opponent gets smarter in step with getting faster, rather than the agent
  # facing a suddenly-sharp opponent at one speed tier. 0 = old pushover
  # behaviour, 1 = leads the ball and shoots straight. If RobotAgent doesn't
  # find this key it falls back to the Inspector/opponentDifficulty default
  # (0.50 for Medium) — safe if you forget to add it, just less deliberate.
  opponent_skill:
    curriculum:
      - name: slow
        completion_criteria:
          measure: progress
          behavior: RobotAgent
          min_lesson_length: 100
          threshold: 0.33
        value: 0.3
      - name: moderate
        completion_criteria:
          measure: progress
          behavior: RobotAgent
          min_lesson_length: 100
          threshold: 0.66
        value: 0.6
      - name: full
        value: 0.85
