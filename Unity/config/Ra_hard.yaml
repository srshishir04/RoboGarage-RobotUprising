# =============================================================================
# Ra_hard.yaml — ML-Agents PPO config for RobotAgent.cs  (trainingMode = Hard)
# -----------------------------------------------------------------------------
# Obs size 24 (Medium 19 + own-goal/role/threat block [19-23]). 4 discrete acts.
# Fast, anticipatory scripted opponent + full Hard reward branch (role switch,
# own-goal penalty, clearance, intercept shaping).
#
# CHANGED vs the previous Ra_hard.yaml:
#   • Added the `opponent_skill` environment parameter (see Ra_medium.yaml for
#     the full explanation — same mechanism, ramped to a sharper ceiling here
#     since Hard is meant to be the hardest tier).
#   • Hyperparameters are UNCHANGED — the egocentric-observation fix changed
#     the relative-vector FORMULA and repurposed obs[2-3] (self-velocity
#     instead of raw heading), not the reward scale. Obs size is still 24.
#
# MUST MATCH UNITY (verify before launch):
#   • Behavior Parameters -> Behavior Name        = RobotAgent
#   • Behavior Parameters -> Vector Obs Space     = 24   (UNCHANGED size; slot
#         meanings changed — do not resume an old Hard checkpoint onto this)
#   • Behavior Parameters -> Discrete Branch 0    = 4
#   • RobotAgent.Training Mode                     = Hard
#   • RobotAgent.ownGoal                           = ASSIGNED (required for Hard)
#   • RobotAgent.opponent                          = ASSIGNED, and on it:
#       - opponentDifficulty = Hard
#       - ball / targetGoal(=AI OwnGoal, renamed from scoringGoal — migrates
#         automatically) / arenaRoot assigned
#       - baseSpeed ~= 0.55   <- RE-CALIBRATE for the 0.60 m/s agent (see note)
#   • Agent (Inspector) -> Max Step                ~ 4000
#
# -- OPPONENT-SPEED RECALIBRATION (unchanged from the previous version) ------
# The agent's sim forward speed was recalibrated 1.14 -> 0.60 m/s to match the
# real robot. The opponent's effective speed is:
#     baseSpeed * SPEED_MULT[Hard]=1.30 * opponent_speed(curriculum)
# With the OLD ceiling (1.3) and baseSpeed=1.2 that was ~2.1 m/s = ~3.5x the
# agent — unbeatable, which starves Hard of any positive reward signal.
# Fix is TWO-part and BOTH parts are required:
#   1) In the Inspector set ScriptedOpponent.baseSpeed ~= 0.55 (Medium~=0.55 m/s,
#      Hard x1.30 ~= 0.72 m/s at curric 1.0).
#   2) Lower the curriculum ceiling below so the top lesson doesn't re-inflate it.
# With baseSpeed=0.55 the lessons resolve to effective opponent speed:
#     0.7 -> 0.52 m/s | 0.9 -> 0.67 m/s | 1.1 -> 0.82 m/s
# i.e. ramps from just-below the agent to ~1.4x — hard but catchable. The NEW
# opponent_skill axis below adds interception LEAD on top of this speed — if
# early Hard training shows the agent never scoring, lower opponent_skill's
# ceiling FIRST (it's the "smarter, not just faster" knob) before touching speed.
#
# Run:
#   mlagents-learn Ra_hard.yaml --run-id=hard_v2_egocentric --force
# =============================================================================

behaviors:
  RobotAgent:
    trainer_type: ppo

    hyperparameters:
      batch_size: 2048          # larger batch — two-way play is higher variance
      buffer_size: 40960
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 5.0e-3
      beta_schedule: linear
      epsilon: 0.2
      epsilon_schedule: linear
      lambd: 0.95
      num_epoch: 3

    network_settings:
      normalize: true
      hidden_units: 512         # more capacity for role + defend + attack logic
      num_layers: 2             # bump to 3 only if Hard clearly underfits
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.995            # long credit chain: defend -> win ball -> score
        strength: 1.0

    keep_checkpoints: 10
    checkpoint_interval: 500000
    # Ceiling, not a target. Easy converged ~2.5M, Medium budgeted 8M; Hard is
    # the hardest tier but watch the reward curve and stop at the plateau. If you
    # shorten this, the progress-gated curriculum below compresses with it.
    max_steps: 20000000
    time_horizon: 256
    summary_freq: 50000
    threaded: true

# -----------------------------------------------------------------------------
# Environment parameters read by RobotAgent.OnEpisodeBegin()
# -----------------------------------------------------------------------------
environment_parameters:

  ball_spawn_radius:
    sampler_type: uniform
    sampler_parameters:
      min_value: 0.5
      max_value: 1.0

  # Sim-to-real pinned value.
  control_distance: 0.2

  # Progress-gated (fraction of max_steps), NOT reward-gated — avoids the
  # threshold-stall seen on Easy. Values multiply ScriptedOpponent's built-in
  # SPEED_MULT[Hard]=1.30 and baseSpeed. Ceiling lowered 1.3 -> 1.1 to keep the
  # opponent beatable against the now-0.60 m/s agent (see recalibration note).
  # At max_steps=20M: warmup->fast at 6.6M, fast->relentless at 13.2M.
  opponent_speed:
    curriculum:
      - name: warmup
        completion_criteria:
          measure: progress
          behavior: RobotAgent
          min_lesson_length: 100
          threshold: 0.33
        value: 0.7
      - name: fast
        completion_criteria:
          measure: progress
          behavior: RobotAgent
          min_lesson_length: 100
          threshold: 0.66
        value: 0.9
      - name: relentless
        value: 1.1

  # NEW: opponent SKILL — see Ra_medium.yaml for the full mechanism. Ramped to
  # a sharper ceiling than Medium (0.95 vs 0.85) since Hard is meant to be the
  # hardest tier the agent ever faces before the real ESP32 opponent robot.
  opponent_skill:
    curriculum:
      - name: warmup
        completion_criteria:
          measure: progress
          behavior: RobotAgent
          min_lesson_length: 100
          threshold: 0.33
        value: 0.4
      - name: fast
        completion_criteria:
          measure: progress
          behavior: RobotAgent
          min_lesson_length: 100
          threshold: 0.66
        value: 0.7
      - name: relentless
        value: 0.95
