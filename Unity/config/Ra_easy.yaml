# =============================================================================
# Ra_easy.yaml — ML-Agents PPO config for RobotAgent.cs  (trainingMode = Easy)
# -----------------------------------------------------------------------------
# Pairs with the EGOCENTRIC-OBSERVATION redesign in RobotAgent.cs (previous
# version: ball-convergence rebalance). Obs size 13 (no opponent, no own-goal;
# Easy trains with no ScriptedOpponent at all, so opponent_skill does not apply
# here — see Ra_medium.yaml / Ra_hard.yaml). Action space: 4 discrete {S,F,L,R}.
#
# CHANGED vs the previous Ra_easy.yaml: NONE of the hyperparameters below —
# the reward SCALE is unchanged by the egocentric-observation fix (only the
# relative-vector FORMULA changed, and obs[2-3] now carries self-velocity
# instead of raw heading). Obs size is still 13. This file is here mainly so
# the "obs contract changed, retrain from scratch" note travels with the
# config, not because the previous tuning was wrong.
#
# MUST MATCH UNITY:
#   • Behavior Parameters -> Behavior Name        = RobotAgent   (key below)
#   • Behavior Parameters -> Vector Obs Space     = 13   (UNCHANGED size; slot
#         meanings changed — do not resume an old Easy checkpoint onto this)
#   • Behavior Parameters -> Discrete Branch 0    = 4
#   • RobotAgent.trainingMode                      = Easy
#   • Agent (Inspector) -> Max Step                ~ 4000  (per-episode length;
#         with kickoff soft-resets this = ~10+ score cycles/episode. NOT the
#         same as max_steps below, which is TOTAL training steps.)
#
# CURRICULUM NOTE: Easy uses a UNIFORM SAMPLER for ball_spawn_radius, NOT a
# reward-gated lesson. The old lesson curriculum stalled Easy at RIGHT:0%
# because it never progressed to the full 360deg spread that forces both turn
# directions. The sampler shows near AND far / all-around spawns from step 0,
# and the dense attractor (R_NEAR) makes even far spawns learnable.
#
# Run:
#   mlagents-learn Ra_easy.yaml --run-id=easy_v2_egocentric --force
#   (never --resume onto a run trained with the OLD observation contract —
#   the obs[2-3] slot meaning changed, so old checkpoints will actively
#   mislead a resumed policy. Start fresh.)
# =============================================================================

behaviors:
  RobotAgent:
    trainer_type: ppo

    hyperparameters:
      batch_size: 1024          # discrete control, small vector obs
      buffer_size: 20480        # 20x batch — stable PPO updates
      learning_rate: 3.0e-4
      learning_rate_schedule: linear   # decay to 0 by max_steps
      beta: 8.0e-3              # HIGHER entropy than Med/Hard: sustains the
                                # exploration Easy needs to discover BOTH turns
      beta_schedule: constant   # keep exploration up the whole run
      epsilon: 0.2
      epsilon_schedule: linear
      lambd: 0.95
      num_epoch: 3

    network_settings:
      normalize: true           # running mean/std; baked into ONNX, so runtime
                                # obs (same scale from build_observations) match
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.99             # dense shaping supplies frequent signal;
                                # 0.99 is enough horizon for a solo scorer
        strength: 1.0

    keep_checkpoints: 10
    checkpoint_interval: 500000
    max_steps: 5000000          # total steps across all training areas;
                                # reachable overnight with several arenas
    time_horizon: 128           # short — shaping is dense, lower variance
    summary_freq: 30000
    threaded: true

# -----------------------------------------------------------------------------
# Environment parameters read by RobotAgent.OnEpisodeBegin()
# -----------------------------------------------------------------------------
environment_parameters:

  # Uniform 0.4–1.0 spread from the start (NOT a lesson). 1.0 = full arena
  # spread (biased toward goal only when < 1). This is the both-turn fix.
  ball_spawn_radius:
    sampler_type: uniform
    sampler_parameters:
      min_value: 0.4
      max_value: 1.0

  # PINNED to the sim-to-real contract value. Do not sample this — runtime
  # uses config.CONTROL_DIST_M = 0.20, and 0.18 caused false-early control.
  control_distance: 0.2
